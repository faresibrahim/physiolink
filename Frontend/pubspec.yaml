name: practice
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.3.2
  flutter_riverpod: ^3.3.1
  go_router: ^17.1.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  dio: ^5.9.2
  dartz: ^0.10.1
  shimmer: ^3.0.0
  flutter_secure_storage: ^9.0.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  video_player: ^2.9.3
  youtube_player_iframe: ^6.0.2
  table_calendar: ^3.1.2



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  json_serializable: ^6.13.1
  build_runner: ^2.13.1
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/physiolink_logo.svg
    - assets/videos/cat_cow_stretch.mp4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
